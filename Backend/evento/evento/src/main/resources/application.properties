spring.application.name=evento
# ===============================
# Configurações do Banco de Dados (PostgreSQL + Docker)
# ===============================
# O formato ${VARIAVEL:valor_padrao} permite que o Docker injete as credenciais,
# mas usa o localhost/postgres caso você rode a aplicação fora do container.
spring.datasource.url=jdbc:postgresql://\({DB_HOST:localhost}:\){DB_PORT:5432}/${DB_NAME:app_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Configurações do JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Configurações Básicas do Spring Security
# ===============================
# Define um usuário e senha padrão em memória (útil para testes iniciais).
# Em produção, a autenticação deve ser gerenciada pela classe SecurityFilterChain.
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ===============================
# Configurações do Servidor
# ===============================
server.port=8080