spring.application.name=evento
# ===============================
# Configurações do Banco de Dados (PostgreSQL + Docker)
# ===============================
# O formato ${VARIAVEL:valor_padrao} permite que o Docker injete as credenciais,
# mas usa o localhost/postgres caso você rode a aplicação fora do container.
spring.datasource.url=jdbc:postgresql://localhost:5432/evento
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Configurações do JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Docker
spring.docker.compose.enabled=false